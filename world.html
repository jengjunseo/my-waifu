<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#11110f" />
  <link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="https://generativelanguage.googleapis.com" />
  <title>Chara · World IF</title>
  <link rel="stylesheet" href="/world-if.css" />
</head>
<body class="world-body">
  <div id="world-app" class="world-shell" hidden>
    <aside id="world-sidebar" class="world-sidebar">
      <a href="/" class="world-brand"><span>✦</span><strong>Chara</strong><small>WORLD IF</small></a>
      <button id="world-new" class="world-new">＋ 새 IF</button>
      <div class="world-side-label">IF 세션</div><div id="world-session-list" class="world-session-list"></div>
      <div class="world-side-bottom"><button id="world-settings-open">⚙ Gemini 설정</button><a href="/">← Character Chat</a></div>
    </aside>
    <main id="world-main" class="world-main"></main>
  </div>
  <div id="world-error" class="world-error" hidden><span id="world-error-text"></span><button id="world-error-close" type="button">×</button></div>
  <div id="world-settings-overlay" class="world-overlay" hidden><section class="world-modal"><header><h2>World IF 설정</h2><button id="world-settings-close" type="button">×</button></header><div id="world-settings-body" class="world-modal-body"></div></section></div>
  <div id="world-composer-cache" hidden><textarea id="world-composer" rows="1" aria-label="World IF 메시지"></textarea><button id="world-send" type="button" aria-label="전송">➤</button></div>
  <script type="module" src="/world-if/app.js"></script>
</body>
</html>
